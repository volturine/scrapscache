services:
  scrapscache-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: scrapscache-mcp
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Upstream Scrapscache server URL (e.g. your self-hosted instance or https://scrapscache.com)
      - SCRAPSCACHE_URL=${SCRAPSCACHE_URL:-https://scrapscache.com}
      # Your personal 32-byte Base64URL sync key (found in Scrapscache Settings > Sync)
      - SCRAPSCACHE_SYNC_KEY=${SCRAPSCACHE_SYNC_KEY:-}
      # Static bearer token for direct connection from Claude Desktop, Cursor, or scripts
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:-my-secret-token}
      # Optional: JSON map for friends to connect their own sync keys:
      # MCP_FRIENDS_TOKENS={"token_alice":"syncKeyAlice...","token_bob":"syncKeyBob..."}
      - MCP_FRIENDS_TOKENS=${MCP_FRIENDS_TOKENS:-}
      - PORT=3001
