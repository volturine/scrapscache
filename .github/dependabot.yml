version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'

  # Base images and Compose services are pinned by digest; these keep them moving.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
