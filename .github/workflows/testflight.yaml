name: TestFlight

# One iPhone app archived in Release, signed with the CI distribution
# certificate and the variant's App Store profile, and uploaded with an App
# Store Connect API key (scripts/ios-testflight.sh). CI/CD calls this after each deployment: the
# dev app after the development Workers, the production app after production.
# The shell reads iOS 27.1's reserved regions, so it needs that SDK: the job
# takes the newest Xcode 27 on the runner and steps aside, with a notice, while
# the image has an older one. Without the Apple secrets it steps aside the same
# way, so a fork or a fresh clone of this workflow does not fail on them.
on:
  workflow_call:
    inputs:
      variant:
        description: dev ("Scraps Cache Dev") or prod ("Scraps Cache"); see IOS_VARIANT in scripts/ios-testflight.sh
        required: true
        type: string
    # Optional, so the job can step aside with a notice when they are unset.
    secrets:
      APPLE_TEAM_ID:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_PRIVATE_KEY:
        required: false
      # Made by scripts/ios-signing.mjs: the CI distribution certificate and the
      # variant's App Store profile (IOS_PROFILE_DEV or IOS_PROFILE_PROD).
      IOS_DIST_CERT_P12:
        required: false
      IOS_DIST_CERT_PASSWORD:
        required: false
      IOS_PROFILE:
        required: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: xcode-27
    env:
      IOS_VARIANT: ${{ inputs.variant }}
      IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check the Apple secrets and the Xcode on this runner
        id: gate
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          if [ -z "$IOS_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ] ||
            [ -z "$IOS_DIST_CERT_P12" ] || [ -z "$IOS_DIST_CERT_PASSWORD" ] || [ -z "$IOS_PROFILE" ]; then
            echo "::notice title=TestFlight skipped::Set APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY, and the signing secrets from npm run ios:signing (repository secrets), to upload the $IOS_VARIANT app after each deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shopt -s nullglob
          xcodes=(/Applications/Xcode_27*.app)
          xcode="$(printf '%s\n' "${xcodes[@]}" | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::notice title=TestFlight skipped::No Xcode 27 on this runner; the app's shell needs the iOS 27.1 SDK."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo xcode-select -s "$xcode"
          sdk="$(xcodebuild -showsdks 2>/dev/null | sed -n 's/.*-sdk iphoneos\([0-9.]*\).*/\1/p' | sort -V | tail -1)"
          if [ "$(printf '%s\n' 27.1 "$sdk" | sort -V | head -1)" != "27.1" ]; then
            echo "::notice title=TestFlight skipped::$xcode has the iOS $sdk SDK; the app's shell needs 27.1 or newer. Try again once the xcode-27 image updates."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using $xcode with the iOS $sdk SDK"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Archive and upload
        if: steps.gate.outputs.ready == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          IOS_OUT_DIR: ${{ runner.temp }}/ios-release
        run: |
          umask 077
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          npm run ios:testflight
