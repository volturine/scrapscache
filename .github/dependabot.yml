version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'

  # Base images and Compose services are pinned by digest; these keep them moving.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'
    ignore:
      # Odd Node majors never become LTS; move to the next LTS by hand together
      # with engines, .nvmrc, CI and the runtime copy in docker/Dockerfile.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
