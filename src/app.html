<!doctype html>
<html lang="en" style="background-color: #ffffff">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />

		<!-- page-meta: the client-only app's title and description. A server-rendered page
		     sets its own (PageMeta.svelte), and hooks.server.ts drops these from it. -->
		<title>Scraps Cache</title>
		<meta
			name="description"
			content="Offline-first notes with optional end-to-end encrypted multi-device sync. Private by design, fast, and self-hostable."
		/>
		<meta property="og:title" content="Scraps Cache" />
		<meta
			property="og:description"
			content="Offline-first notes with optional end-to-end encrypted multi-device sync. Private by design, fast, and self-hostable."
		/>
		<meta name="twitter:title" content="Scraps Cache" />
		<meta
			name="twitter:description"
			content="Offline-first notes with optional end-to-end encrypted multi-device sync. Private by design, fast, and self-hostable."
		/>
		<!-- /page-meta -->

		<!-- Open Graph / WhatsApp / Telegram / Signal / Facebook / iMessage Link Preview -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Scraps Cache" />
		<meta property="og:image" content="https://scrapscache.com/og-preview.png" />
		<meta property="og:image:secure_url" content="https://scrapscache.com/og-preview.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Scraps Cache - Private, offline-first notes with encrypted sync"
		/>
		<meta property="og:url" content="https://scrapscache.com/" />

		<!-- Twitter / X Card Link Preview -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://scrapscache.com/og-preview.png" />
		<meta
			name="twitter:image:alt"
			content="Scraps Cache - Private, offline-first notes with encrypted sync"
		/>

		<!-- iOS Native App Capabilities & Home Screen Icon.
		     No apple-mobile-web-app-status-bar-style: the translucent style hands
		     the status bar to iOS, which hazes whatever the page paints under it.
		     Without it the status bar is opaque and takes the solid colour this
		     document's background already carries. A permanent fixed strip lets
		     installed iOS sample that colour again when the theme changes. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Scraps Cache" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

		<!-- Android / Chrome Native Capabilities -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="application-name" content="Scraps Cache" />
		<meta name="theme-color" content="#1a1a1a" />
		<meta name="format-detection" content="telephone=no" />

		<!-- Favicons & Manifest -->
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

		<!-- Theme and iOS flags before any CSS; a file, so the page can also be prerendered under the CSP. -->
		<script src="/boot.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background-color: inherit">
		<!-- Keep the opaque sampler present before the app loads and above modals. -->
		<div
			data-status-sample
			data-over-modals
			aria-hidden="true"
			style="background-color: inherit"
		></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
