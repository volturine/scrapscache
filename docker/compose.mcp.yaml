# Optional MCP Server overlay for Scraps Cache Docker Compose
# Usage: docker compose -f docker/compose.yaml -f docker/compose.mcp.yaml up -d

services:
  mcp-server:
    build:
      context: ../recipes/mcp-server
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-3001}:3001"
    environment:
      SCRAPSCACHE_URL: "${SCRAPSCACHE_ORIGIN:-http://app:3000}"
      SCRAPSCACHE_SYNC_KEY: "${SCRAPSCACHE_SYNC_KEY:-}"
      MCP_BEARER_TOKEN: "${MCP_BEARER_TOKEN:-}"
      MCP_FRIENDS_TOKENS: "${MCP_FRIENDS_TOKENS:-}"
      PORT: 3001
    depends_on:
      - app
