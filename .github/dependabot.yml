version: 2

# One weekly pull request for every ecosystem and directory. Each entry below
# joins the group; the schedule lives on the group, and `patterns` is required
# on every member.
multi-ecosystem-groups:
  weekly-batch:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-batch

  # Base images and Compose services are pinned by digest; these keep them moving.
  - package-ecosystem: docker
    directory: /docker
    patterns: ['*']
    multi-ecosystem-group: weekly-batch
    ignore:
      # Odd Node majors never become LTS; move to the next LTS by hand together
      # with engines, .nvmrc, CI and the runtime copy in docker/Dockerfile.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /docker
    patterns: ['*']
    multi-ecosystem-group: weekly-batch

  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-batch
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # The MCP recipe ships its own npm project and Docker image; cover them too.
  - package-ecosystem: npm
    directory: /recipes/mcp-server
    patterns: ['*']
    multi-ecosystem-group: weekly-batch
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /recipes/mcp-server/docker
    patterns: ['*']
    multi-ecosystem-group: weekly-batch
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
